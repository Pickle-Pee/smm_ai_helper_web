# Brenvio web — application container.
# Installed on the server as /opt/brenvio-web/compose.yaml; settings come from /opt/brenvio-web/.env.
# Runs in its own compose project and network: it never joins the backend's networks.
name: brenvio-web

services:
  web:
    image: brenvio-web:${BRENVIO_TAG:?BRENVIO_TAG is not set}
    # Loopback only: the reverse proxy is the single public entry point.
    ports:
      - "127.0.0.1:${BRENVIO_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Shared 2 vCPU / 4 GB host with the production backend: keep the frontend small.
    mem_limit: 384m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
