# Edge reverse proxy (Caddy): TLS termination and automatic Let's Encrypt certificates.
# Installed as /opt/brenvio-web/edge/compose.yaml.
#
# Host networking: Caddy binds :80/:443 on the host and proxies to loopback ports
# (127.0.0.1:${BRENVIO_PORT}). It does not attach to any Docker network, so it cannot
# reach backend containers unless a site block explicitly proxies to a loopback port.
name: brenvio-edge

services:
  caddy:
    image: caddy:2.10-alpine
    network_mode: host
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  login-throttle:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    network_mode: host
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=8m,uid=101,gid=101,mode=0700
    volumes:
      - ./login-throttle.conf:/etc/nginx/nginx.conf:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 48m
    cpus: "0.25"
    pids_limit: 32
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  # Certificates and ACME account live here — never delete without a plan.
  caddy_data:
    name: brenvio_caddy_data
  caddy_config:
    name: brenvio_caddy_config
