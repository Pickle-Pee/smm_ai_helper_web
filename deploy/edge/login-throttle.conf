worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr crit;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Caddy overwrites the header with the TCP peer address. This listener is loopback-only.
    limit_req_zone $http_x_brenvio_client zone=login_client:1m rate=12r/m;
    limit_req_zone $server_name zone=login_global:1m rate=20r/s;

    server {
        listen 127.0.0.1:8101;
        server_name localhost;
        client_max_body_size 1k;
        client_body_timeout 10s;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        location ~ ^/v2/auth/telegram/(challenge|exchange)$ {
            if ($http_x_brenvio_client = "") { return 404; }
            limit_req zone=login_client burst=8 nodelay;
            limit_req zone=login_global burst=30 nodelay;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Brenvio-Client "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_pass http://127.0.0.1:8000;
        }

        location @rate_limited {
            default_type application/json;
            add_header Cache-Control "private, no-store" always;
            add_header Retry-After 5 always;
            add_header X-Request-ID $request_id always;
            return 429 '{"schema_version":"web_api.v2","kind":"ERROR","code":"rate_limited","request_id":"$request_id"}';
        }

        location / {
            return 404;
        }
    }
}
