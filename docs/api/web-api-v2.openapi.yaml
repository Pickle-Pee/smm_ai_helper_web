      x-min-role: viewer
      x-delegates-to: CaseMentorService.history (proposed owner-id variant B3b)
      x-error-codes: {'401': [unauthenticated], '404': [not_found], '409': [mentor_not_applicable], '422': [invalid_request], '503': [temporarily_unavailable]}
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200':
          description: Up to 50 most recent turns (existing bound).
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MentorHistoryResult'}
              examples:
                default: {externalValue: fixtures/responses/mentor-history.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
