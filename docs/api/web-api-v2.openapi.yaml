  /v2/threads/{thread_id}/chat-messages:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    post:
      tags: [web-chat]
      operationId: submitChatMessage
      summary: FUTURE - send a free-form chat message to a `chat` thread
      description: |
        Not part of the internal technical beta; a release gate of the public launch (B9/F7, gates G1-G7).
        While `WEB_CHAT_ENABLED` is off the route answers `403 feature_disabled`.

        Design constraints this contract reserves (no Telegram logic changes):
        * **Separate scope** - chat memory key `web:t:<thread_id>`, outside the Telegram `tg:<id>` space; the
          legacy `/chat/message`, `ChatExecutionService`, `conversations` and `messages` are not used.
        * **Separate receipt** - `web_chat_execution.v1` in the web layer: claim before the model call,
          `ambiguous` on unknown outcome, a running claim is never stolen.
        * **Serialized execution per thread** - a request_key receipt only deduplicates the SAME request. Two
          different messages in one thread are serialized by the thread's single in-flight slot plus
          `expected_last_seq` (`409 thread_busy` / `409 stale_thread`). No SQL transaction stays open during
          the model call.
        * **No duplicated memory** - the user turn, the reply and context/facts updates are buffered and
          committed in the same transaction as the reply snapshot. An `ambiguous` or failed attempt commits
          nothing to chat memory, so a retry with a new key does not duplicate context.
        * **Model usage limits** - input at most 4000 characters, bounded output tokens, per-user and
          per-organization daily caps evaluated BEFORE the claim (`429 quota_exceeded`), no image generation.
        * The browser receives the allowlisted `WebChatReply` only; the legacy `debug` field never leaves the
          backend.
      x-status: future
      x-stage: B9
      x-availability: public-launch
      x-min-role: editor
      x-feature-flag: WEB_CHAT_ENABLED
      x-delegates-to: ChatService.handle with injected WebThreadMemory / WebThreadContext (proposed)
      x-error-codes:
        '401': [unauthenticated]
        '403': [csrf_failed, forbidden, feature_disabled]
        '404': [not_found]
        '409': [request_conflict, thread_busy, stale_thread]
        '422': [invalid_request]
        '429': [rate_limited, quota_exceeded]
        '503': [temporarily_unavailable]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitChatMessageRequest'}
      responses:
        '200':
          description: Reply stored (or replay of a stored reply, or `ambiguous`).
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: Feature disabled in the internal beta, CSRF failure or insufficient role.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                featureDisabled: {externalValue: fixtures/errors/feature-disabled.403.json}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brenvio_session
      description: |
        Opaque random 256-bit session token. `HttpOnly; Secure; SameSite=Lax; Path=/`, no `Domain`. Only
        `sha256(token)` is stored server-side (`web_sessions`). Proposed lifetimes: idle 7 days, absolute
        30 days; rotated on login. Not accepted on legacy bot routes; the bot token is not accepted here.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required on every unsafe method together with a same-origin `Origin` / `Sec-Fetch-Site`. The value is
        the session-bound token from `exchangeTelegramLoginToken` or `getCsrfToken`. There is no CORS: the
        API is same-origin only.

  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: message_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequestKeyPath:
      name: request_key
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RequestKey'}
    LegacyPublicId:
      name: public_id
      in: path
      required: true
      description: Existing legacy history identifier (`g:`/`w:`/`t:`/`r:`/`l:`/`c:` prefixes).
      schema:
        type: string
        minLength: 3
        maxLength: 80
        pattern: '^(g:[0-9a-f]{64}|w:[0-9a-f]{32}|t:[1-9][0-9]{0,18}|r:[0-9a-f]{64}|l:chat|c:(0|[1-9][0-9]{0,18}))$'
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from `next_cursor`. Not a stable export cursor across deletions.
      schema: {type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated UUID that makes a create safe to retry after a lost response. Scoped to the
        principal. Recommended for every create; without it a retried create can produce a duplicate.
      schema: {type: string, format: uuid}

  headers:
    SessionSetCookie:
      description: '`__Host-brenvio_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Lax`'
      schema: {type: string}
    SessionClearCookie:
      description: '`__Host-brenvio_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0`'
      schema: {type: string}
    CacheControlPrivate:
      description: |
        Exactly `private, no-store` on EVERY response of `/v2` (success, redirect-free 2xx/204 and every error),
        because every `/v2` response is either tenant data or depends on the session. No browser cache, no
        shared cache (CDN, reverse proxy, service worker) may store it. There are no public `/v2` responses.
        See README, "Caching and the edge".
      required: true
      schema: {type: string, const: 'private, no-store'}
    RetryAfter:
      description: |
        Delta-seconds (never an HTTP-date) until the identical request may be repeated. No upper bound: for
        `quota_exceeded` it is the time until `quota.resets_at` and can exceed a day. Clients never compute
        it themselves and never retry before it elapses.
      schema: {type: integer, minimum: 1}
    RequestId:
      description: Correlation id, equal to `ErrorResponse.request_id`. Contains no user data.
      schema: {type: string}

  responses:
    Unauthenticated:
      description: No valid session, or an invalid one-time login token.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            unauthenticated: {externalValue: fixtures/errors/unauthenticated.401.json}
            loginTokenInvalid: {externalValue: fixtures/errors/login-token-invalid.401.json}
    Forbidden:
      description: CSRF failure, insufficient role/authorship for a visible resource, or a disabled feature.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            forbidden: {externalValue: fixtures/errors/forbidden.403.json}
            csrfFailed: {externalValue: fixtures/errors/csrf-failed.403.json}
    NotFound:
      description: The resource does not exist or is not visible to the caller. The two cases are indistinguishable.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            notFound: {externalValue: fixtures/errors/not-found-foreign-project.404.json}
    Conflict:
      description: State conflict. See the operation's `x-error-codes` for the possible codes.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            staleProject: {externalValue: fixtures/errors/stale-project.409.json}
    PayloadTooLarge:
      description: Body exceeds the route limit. When produced by the edge the body may not be JSON.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidRequest:
      description: Validation failed. Submitted values are never echoed back.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            invalidRequest: {externalValue: fixtures/errors/invalid-request.422.json}
    RateLimited:
      description: |
        Rate limit or usage quota, evaluated before anything is stored or admitted (no message row, no core
        claim, no model call). `Retry-After` is always present.

        * `rate_limited` - short window. The client may repeat the IDENTICAL request (same `request_key`)
          once after `Retry-After`; a second consecutive `429` is shown to the user instead of looping.
        * `quota_exceeded` - daily cap; `quota.resets_at` says when it resets and `Retry-After` counts down to
          it (may be many hours). Never retried automatically; the UI shows the reset time. Because nothing
          was admitted, a later explicit attempt may reuse the same key or start with a new one.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            rateLimited: {externalValue: fixtures/errors/rate-limited.429.json}
            quotaExceeded: {externalValue: fixtures/errors/quota-exceeded.429.json}
    Unavailable:
      description: |
        Outcome not determined or a dependency is unavailable. For `submitMessage` this never means
        "nothing happened": recover by key. Edge-generated 502/504 responses may not be JSON and must be
        treated the same way.
      headers:
        Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            temporarilyUnavailable: {externalValue: fixtures/errors/temporarily-unavailable.503.json}

  schemas:
    # ------------------------------------------------------------------
    # Common (proposed)
    # ------------------------------------------------------------------
    SchemaVersion:
      x-status: proposed
      description: Version of the Web API v2 response envelope. Embedded core payloads keep their own `schema_version`.
      type: string
      const: web_api.v2

    Timestamp:
      x-status: proposed
      description: RFC 3339 timestamp with an explicit UTC offset.
      type: string
      format: date-time

    Sha256Hex:
      x-status: proposed
      type: string
      pattern: '^[0-9a-f]{64}$'

    RequestKey:
      x-status: proposed
      description: |
        Client-generated idempotency key: the literal prefix `w-` followed by a lowercase UUIDv7. The prefix
        keeps web keys disjoint from bot keys (`tg:<actor>:<chat>:<message>`); the value satisfies the
        existing core pattern `^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$`. Keys live in the namespace of the
        authenticated user and are never reused, also not after receipt expiry.
      type: string
      pattern: '^w-[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: [w-01939f6c-8a10-7c3e-9b1a-4d5e6f708192]

    ErrorCode:
      x-status: proposed
      description: |
        Allowlisted error codes. The HTTP status, retry policy and meaning of each code are in the root
        `x-error-catalog`. Codes marked EXISTING there come from `copilot_api.v1` and keep their meaning.
        The legacy Telegram code `stale_context` (bound to a Telegram chat context version) cannot occur on
        `/v2`, because the web layer always calls the core with `context_version = None`.
        The core code `execution_invalid` (HTTP 500 in `copilot_api.v1`) is not exposed either: after it the
        core receipt is `ambiguous`, which `/v2` reports as the durable state `ambiguous`, not as an error.
      type: string
      enum:
        - unauthenticated
        - login_token_invalid
        - csrf_failed
        - forbidden
        - feature_disabled
        - not_found
        - mentor_explanation_missing
        - request_conflict
        - revision_conflict
        - thread_busy
        - stale_thread
        - stale_project
        - idempotency_conflict
        - confirmation_changed
        - confirmation_unavailable
        - telegram_identity_required
        - import_source_missing
        - mentor_not_applicable
        - result_not_ready
        - result_format_unsupported
        - result_gone
        - payload_too_large
        - invalid_request
        - invalid_confirmation
        - rate_limited
        - quota_exceeded
        - temporarily_unavailable
        - result_corrupted
        - result_unreadable

    ErrorResponse:
      x-status: proposed
      description: |
        The only error body of `/v2`. It never echoes submitted values and has no free-text message: the UI
        maps `code` to localized text. `owned_site` mirrors the existing `copilot_api.v1` error field and is
        present only for owned-site confirmation errors.
      type: object
      additionalProperties: false
      required: [schema_version, kind, code, request_id]
      properties:
