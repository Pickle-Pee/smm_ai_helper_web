      x-availability: internal-beta
      x-min-role: viewer
      x-delegates-to: web tables; GraphRunReader.get_for_owner (lazy materialization only, proposed owner-id variant)
      x-error-codes: {'401': [unauthenticated], '404': [not_found], '422': [invalid_request], '503': [temporarily_unavailable]}
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: before_seq
