              examples:
                reopenAfterReceiptExpiry: {externalValue: fixtures/responses/thread-messages-reopen.200.json}
                clarificationHistory: {externalValue: fixtures/responses/thread-messages-clarification.200.json}
                formatUnsupported: {externalValue: fixtures/responses/thread-messages-format-unsupported.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [workspace]
      operationId: submitMessage
      summary: Submit an AI request (or a clarification revision) to a Copilot thread
      description: |
        The only operation that can start AI work. The core is always invoked with
        `owner = principal.user_id` and the brand of the thread's project; the DTO has no owner field.

        **Idempotency.** `(principal, request_key, revision)` identifies the request.
        * Same key, same revision, same payload: replay. The stored state is returned, the core is not
          asked to generate again. Replaying a still-running request returns its current state.
        * Same key, same revision, different payload: `409 request_conflict`.
        * Key already used in another thread: `409 request_conflict`.
        * `revision = n + 1` is accepted only if revision `n` is the latest and ended in `needs_input`, and
          `message` is unchanged; otherwise `409 revision_conflict`. The SAME `request_key` is kept, which
          is the existing core clarification contract.
        * A different request while another one is `pending`/`running` in this thread: `409 thread_busy`.

        **Status codes.**
        * `200` - the request reached a durable state synchronously: `completed`, `needs_input`,
          `unsupported`, or `ambiguous` when the core itself recorded an unknown provider outcome
          (`finish` without a response); or a replay of any terminal state.
        * `202` - the request is `running` (a workflow was started, or a replay found it still running).
          Poll `getMessage`.
        * `503 temporarily_unavailable` - the outcome is NOT known yet (in flight elsewhere, dependency down,
          crash window). The client MUST recover with `getRequestByKey` and MUST NOT mint a new key, neither
          automatically nor on a plain "retry" button; a new key exists only behind the explicit, warned
          "start a new request" action.
        * Rate limits and quotas (`429`) are evaluated before the core is asked to admit anything.

        **Long requests.** DIRECT and single-module results are computed inside this HTTP request by the
        existing core, bounded by `GRAPH_TIMEOUT_SECONDS` (300 s today). The edge route timeout must exceed
        it. A client disconnect does not cancel the work; recover with `getRequestByKey`.

        **No exactly-once.** The core commits its claim before any provider call and never re-executes a
        crashed or ambiguous claim automatically. A provider may still have been called once for a request
        that ends `ambiguous`.

        **Authorization recheck.** Membership is checked before the core is called and again immediately
        before the response is built. If it was revoked in between, the response is `404` and the started
        work continues as the author's own core record; it is not cancelled.
      x-status: proposed
      x-stage: B5
      x-availability: internal-beta
      x-min-role: editor
      x-delegates-to: CopilotAPI.execute_for_owner (proposed refactor B3a of the existing CopilotAPIService.execute)
      x-error-codes:
        '401': [unauthenticated]
        '403': [csrf_failed, forbidden, feature_disabled]
        '404': [not_found]
        '409': [request_conflict, revision_conflict, thread_busy, confirmation_changed, confirmation_unavailable]
        '413': [payload_too_large]
        '422': [invalid_request, invalid_confirmation]
        '429': [rate_limited, quota_exceeded]
        '503': [temporarily_unavailable]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitMessageRequest'}
            examples:
              strategy: {externalValue: fixtures/requests/submit-strategy.rev1.json}
              calculation: {externalValue: fixtures/requests/submit-calculation.rev1.json}
              positioningNeedsInput: {externalValue: fixtures/requests/submit-positioning.rev1.json}
              positioningClarification: {externalValue: fixtures/requests/submit-positioning.rev2.json}
      responses:
        '200':
          description: Durable state reached synchronously, or replay of a terminal state.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResult'}
              examples:
                directResult: {externalValue: fixtures/responses/message-direct-result.200.json}
                moduleResult: {externalValue: fixtures/responses/message-module-result.200.json}
                needsInput: {externalValue: fixtures/responses/message-needs-input.200.json}
                clarificationCompleted: {externalValue: fixtures/responses/message-clarification-completed.200.json}
                unsupported: {externalValue: fixtures/responses/message-unsupported.200.json}
                ambiguous: {externalValue: fixtures/responses/message-ambiguous.200.json}
        '202':
          description: Admitted and running. Poll `getMessage` using `poll_after_ms`.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
