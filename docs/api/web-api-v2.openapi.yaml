openapi: 3.1.0

info:
  title: Brenvio Web API v2 (PROPOSED contract draft)
  version: 2.0.0-draft.2
  summary: Contract-first draft of the authenticated browser API for Brenvio. Nothing here is implemented yet.
  description: |
    **Status: PROPOSED.** This document is the C0 deliverable of
    [smm_ai_helper_web#7](https://github.com/Pickle-Pee/smm_ai_helper_web/issues/7), derived from the
    architecture audit [#6](https://github.com/Pickle-Pee/smm_ai_helper_web/issues/6) (Addendum 1, Addendum 2
    and the final review). No `/v2` route exists in the backend today.

    Reading rules:

    * Every operation carries `x-status`: `proposed` (target of the internal technical beta), `future`
      (designed, behind a feature flag, not part of the beta) or `deferred` (shape intentionally not frozen).
    * Every schema carries `x-status`: `existing` (a verbatim projection of a DTO that exists in
      `Pickle-Pee/smm_ai_helper@76b6c1b`, file named in `x-source`) or `proposed` (new in Web API v2).
    * `existing` schemas are copied from the backend and MUST NOT be edited here. If the backend DTO changes,
      a new snapshot `schema_version` + decoder + upcaster is introduced instead (see README, "Durable history").
    * Paths are the native FastAPI paths (`/v2/...`). The browser reaches them same-origin through the edge
      as `/api/v2/...` (see `servers`). Legacy bot routes (`/copilot/*`, `/projects/*`, `/chat/*`,
      `/internal/*`, ...) are a different trust zone and are NOT part of this contract.
    * Authorization is never derived from a client-supplied owner. No request DTO has an owner, user,
      organization-member or Telegram field. `BOT_BACKEND_TOKEN` and `X-Telegram-User-ID` are never accepted
      on `/v2` and never sent by a browser.
    * The API promises safe replay and recovery. It does NOT promise exactly-once execution of an external
      model provider. `ambiguous` is reported only when the core recorded it, never inferred from time.
    * Every `/v2` response - success or error, including `401`/`404` - carries
      `Cache-Control: private, no-store` (`components/headers/CacheControlPrivate`). No shared cache, CDN
      or reverse proxy may store any `/v2` response.
    * Result snapshots separate the IMMUTABLE stored record (`stored`, `provenance`; hashed and persisted
      once) from the COMPUTED `presentation` (frozen decoder + upcasters) and the per-viewer `author`
      projection. Viewer-relative fields (`UserRef.is_self`) are never persisted or hashed.
  contact:
    name: Brenvio web contract (issue tracker)
    url: https://github.com/Pickle-Pee/smm_ai_helper_web/issues/7
  x-contract-status: proposed
  x-backend-baseline: Pickle-Pee/smm_ai_helper@76b6c1b (master, 2026-10-30)
  x-response-schema-version: web_api.v2

servers:
  - url: /api
    description: Public same-origin edge (Caddy). `/api/v2/*` is rewritten to FastAPI `/v2/*`; nothing else is routed.
  - url: http://127.0.0.1:8000
    description: Native FastAPI on the host loopback (tests and local development only; never public).

tags:
  - name: auth
    description: Identity and cookie sessions (Telegram one-time login in the internal beta).
  - name: organizations
    description: Tenant boundary. Internal beta = one personal organization per user.
  - name: projects
    description: SaaS projects and their brand (`project_brands`), separate from the legacy Telegram `brand_profiles`.
  - name: workspace
    description: Threads, AI requests, execution state and recovery.
  - name: results
    description: Durable immutable result snapshots.
  - name: mentor
    description: Case mentor for completed strategy runs.
  - name: legacy-telegram
    description: The caller's own private Telegram history. Never organization-scoped.
  - name: web-chat
    description: FUTURE free-form web chat (`WEB_CHAT_ENABLED`). Not part of the internal technical beta.

security:
  - sessionCookie: []

x-error-catalog:
  # code -> HTTP status, retry policy and meaning. `retry` values:
  #   never            - do not retry; fix the request or the user's state
  #   same_request     - repeat the identical request (same key, same payload); safe
  #   after_delay      - repeat the identical request after Retry-After / backoff (may be automatic, bounded)
  #   after_reset      - never automatic; offer the user to try again after the quota reset (Retry-After)
  #   reauthenticate   - obtain a new session, then repeat
  #   explicit_new_key - only on an explicit user action, with a NEW request_key (may generate again)
  unauthenticated:
    status: 401
    retry: reauthenticate
    meaning: 'No valid session (missing, expired, revoked) or a non-session credential was presented.'
  login_token_invalid:
    status: 401
    retry: never
    meaning: 'One-time login token is unknown, expired or already used. The three cases are indistinguishable.'
  csrf_failed:
    status: 403
    retry: same_request
    meaning: 'Missing/invalid X-CSRF-Token or a cross-site Origin. Fetch a new token first.'
  forbidden:
    status: 403
    retry: never
    meaning: 'The resource is visible to the caller but the action needs a higher role or authorship.'
  feature_disabled:
    status: 403
    retry: never
    meaning: 'The capability is behind a feature flag that is off for this deployment or principal.'
  not_found:
    status: 404
    retry: never
    meaning: 'The resource does not exist OR belongs to another tenant/user. The two are indistinguishable by design.'
  mentor_explanation_missing:
    status: 404
    retry: never
    meaning: 'The caller may read the message but no mentor explanation has been created yet.'
  request_conflict:
    status: 409
    retry: never
    meaning: 'The request_key (+revision) was already used with a different payload or in another thread.'
  revision_conflict:
    status: 409
    retry: never
    meaning: 'The revision is not the next revision of a NEEDS_INPUT request or the message text changed.'
  thread_busy:
    status: 409
    retry: after_delay
    meaning: 'Another request is in flight in this thread. One execution per thread at a time.'
  stale_thread:
    status: 409
    retry: never
    meaning: 'FUTURE web chat only. expected_last_seq does not match the thread; reload the thread.'
  stale_project:
    status: 409
    retry: never
    meaning: 'expected_version does not match the stored project or brand version; reload and re-apply.'
  idempotency_conflict:
    status: 409
    retry: never
    meaning: 'Idempotency-Key was already used with a different create payload.'
  confirmation_changed:
    status: 409
    retry: never
    meaning: 'EXISTING core code. The confirmed owned-site statements no longer match.'
  confirmation_unavailable:
    status: 409
    retry: never
    meaning: 'EXISTING core code. The stored owned-site snapshot is missing; start a new request.'
  telegram_identity_required:
    status: 409
    retry: never
    meaning: 'The principal has no linked Telegram identity.'
  import_source_missing:
    status: 409
    retry: never
    meaning: 'The principal has no legacy Telegram brand profile to import.'
  mentor_not_applicable:
    status: 409
    retry: never
    meaning: 'The message has no completed strategy run to explain.'
  result_not_ready:
    status: 409
    retry: after_delay
    meaning: 'The request is still pending or running.'
  result_format_unsupported:
    status: 409
    retry: never
    meaning: 'The snapshot is intact but was written in a schema_version this server has no decoder for. NOT corruption.'
  result_gone:
    status: 410
    retry: explicit_new_key
    meaning: 'No result exists and none can be obtained under this key (ambiguous or expired).'
  payload_too_large:
    status: 413
    retry: never
    meaning: 'Request body exceeds the route limit.'
  invalid_request:
    status: 422
    retry: never
    meaning: 'Validation failed. Submitted values are never echoed.'
  invalid_confirmation:
    status: 422
    retry: never
    meaning: 'EXISTING core code. Unknown or ineligible confirmation statements.'
  rate_limited:
    status: 429
    retry: after_delay
    meaning: 'Short-window rate limit (seconds to minutes). Checked before any core admission: nothing was stored or admitted, so the identical request with the same key may be sent once Retry-After elapses.'
  quota_exceeded:
    status: 429
    retry: after_reset
    meaning: 'Daily usage cap for the user or organization (`quota` in the body). Checked before any core admission: nothing was stored or admitted. Never retried automatically; Retry-After = seconds until quota.resets_at (may exceed 3600).'
  temporarily_unavailable:
    status: 503
    retry: after_delay
    meaning: 'Outcome not determined yet or a dependency is down. Recover by key; never mint a new key automatically.'
  result_corrupted:
    status: 503
    retry: never
    meaning: 'Integrity check of the STORED payload failed (sha256(canonical(stored payload)) != stored.payload_sha256), evaluated before any decoder or upcaster. Real data damage; quarantined, never regenerated silently. Never caused by an upcast.'
  result_unreadable:
    status: 503
    retry: after_delay
    meaning: 'The stored payload is intact (hash matches) but its frozen decoder or an upcaster failed. A server defect; data is untouched.'

paths:
  /v2/auth/telegram/exchange:
    post:
      tags: [auth]
      operationId: exchangeTelegramLoginToken
      summary: Exchange a one-time Telegram login token for a browser session
      description: |
        The bot obtains a single-use link from the bot-only internal endpoint
        (`POST /internal/identity/web-login-link`, not routed by the edge, not in this document) and sends
        `https://<app>/auth/telegram#t=<token>` to the user. The page reads the fragment and posts it here.

        * The token is single-use, TTL 10 minutes, stored only as a hash. Unknown, expired and used tokens are
          indistinguishable (`401 login_token_invalid`).
        * On success the session is bound to the SAME internal `users.id` the bot uses; no data is copied.
        * Sets `__Host-brenvio_session` (HttpOnly, Secure, SameSite=Lax, Path=/). A previous session cookie on
          the same browser is revoked (session fixation protection).
        * No CSRF token is required (there is no session yet) but `Origin` / `Sec-Fetch-Site` MUST be same-origin.
        * On first login a personal organization and a personal project are provisioned; the legacy Telegram
          brand profile, if any, is copied once into `project_brands` (see `importTelegramBrand`).
      x-status: proposed
      x-stage: B2
      x-availability: internal-beta
      x-min-role: public
      x-feature-flag: WEB_API_ENABLED, WEB_TELEGRAM_LOGIN_ENABLED
      x-error-codes: {'401': [login_token_invalid], '403': [csrf_failed], '422': [invalid_request], '429': [rate_limited], '503': [temporarily_unavailable]}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelegramExchangeRequest'}
            examples:
              default: {externalValue: fixtures/requests/auth-exchange.json}
      responses:
        '200':
          description: Session created.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionSetCookie'}
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
              examples:
                default: {externalValue: fixtures/responses/auth-exchange.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: Get the CSRF token bound to the current session
      description: |
        Returns the token the client must echo in `X-CSRF-Token` on every unsafe method (POST, PATCH, PUT,
        DELETE). The token is bound to the session and changes when the session is rotated. Keep it in memory;
        do not persist it. Call this after a page reload and after any `403 csrf_failed`.
      x-status: proposed
      x-stage: B2
      x-availability: internal-beta
      x-min-role: self
      x-error-codes: {'401': [unauthenticated], '503': [temporarily_unavailable]}
      responses:
        '200':
          description: Current CSRF token.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
              examples:
                default: {externalValue: fixtures/responses/auth-csrf.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: |
        Revokes the server-side session and clears the cookie. Idempotent: a request without a valid session
        also returns 204 and clears the cookie. With a valid session `X-CSRF-Token` is required.
        Logout does not cancel running AI work; results stay available after the next login.
      x-status: proposed
      x-stage: B2
      x-availability: internal-beta
      x-min-role: public
      x-error-codes: {'403': [csrf_failed], '503': [temporarily_unavailable]}
      security:
        - {}
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Session revoked (or there was none).
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
            Set-Cookie: {$ref: '#/components/headers/SessionClearCookie'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, memberships, session and feature flags
      x-status: proposed
      x-stage: B2
      x-availability: internal-beta
      x-min-role: self
      x-error-codes: {'401': [unauthenticated], '503': [temporarily_unavailable]}
      responses:
        '200':
          description: The authenticated principal.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
              examples:
                default: {externalValue: fixtures/responses/me.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/me/telegram-history:
    get:
      tags: [legacy-telegram]
      operationId: listTelegramHistory
      summary: The caller's own Telegram history (read-only, private)
      description: |
        Read-only list of what the caller created through the Telegram bot. Delegates to the existing
        `ProjectHistoryService` through an owner-id variant (proposed backend change B11).

        Privacy invariants:
        * Scoped to `principal.user_id` only. There is no organization or project parameter and no other
          user's history is reachable through any `/v2` path.
        * Nothing here is shared with organization members, ever, by default. Importing a single item into a
          project is an explicit, per-item, future action (not in C0).
        * Requires a linked Telegram identity (`409 telegram_identity_required` otherwise).

        Pagination keeps the existing bounded offset semantics (limit 1-50, offset 0-10000). The list can
        shift when new items arrive; it is a navigation aid, not a stable export cursor.
      x-status: proposed
      x-stage: B11
      x-availability: internal-beta
      x-min-role: self
      x-delegates-to: ProjectHistoryService.recent (owner-id variant, proposed)
      x-error-codes: {'401': [unauthenticated], '409': [telegram_identity_required], '422': [invalid_request], '503': [temporarily_unavailable]}
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
        - name: source_type
          in: query
          schema: {$ref: '#/components/schemas/LegacySourceType'}
        - name: status
          in: query
          description: Existing filter. `completed`, `failed` and `running` are groups; other values match exactly.
          schema: {type: string, pattern: '^[a-z_]{1,32}$'}
        - name: query
          in: query
          description: Existing prefix search on the bounded title.
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: One page of the caller's legacy history.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyHistoryPage'}
              examples:
                default: {externalValue: fixtures/responses/telegram-history.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/me/telegram-history/{public_id}:
    get:
      tags: [legacy-telegram]
      operationId: getTelegramHistoryItem
      summary: One legacy history item (DEFERRED - result shape not frozen)
      description: |
        The existing `ProjectHistoryService.get` returns a per-source result as untyped dictionaries (task
        result, fixed-workflow artifacts, graph case, receipt, conversation turns). C0 deliberately does NOT
        invent a typed schema for them. The typed projection is to be designed in B11; until then this
        operation is not implemented and the UI shows the list only.
      x-status: deferred
      x-stage: B11
      x-availability: internal-beta
      x-min-role: self
      x-error-codes: {'401': [unauthenticated], '404': [not_found], '409': [telegram_identity_required], '503': [temporarily_unavailable]}
      parameters:
        - $ref: '#/components/parameters/LegacyPublicId'
      responses:
        '200':
          description: Item metadata plus an untyped, bounded result (shape to be defined in B11).
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyHistoryItemDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/orgs:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: Organizations the caller is an active member of
      description: |
        Internal beta: exactly one `personal` organization with role `owner`. Team organizations, invitations
        and member management (`/v2/orgs/{org_id}/members`) are FUTURE (B10) and not in this document.
      x-status: proposed
      x-stage: B4
      x-availability: internal-beta
      x-min-role: self
      x-error-codes: {'401': [unauthenticated], '503': [temporarily_unavailable]}
      responses:
        '200':
          description: Active memberships.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationList'}
              examples:
                default: {externalValue: fixtures/responses/orgs.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/orgs/{org_id}/projects:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects of an organization
      description: Keyset pagination ordered by `updated_at` descending, then `id`. Archived projects are included; filter by `status`.
      x-status: proposed
      x-stage: B4
      x-availability: internal-beta
      x-min-role: viewer
      x-error-codes: {'401': [unauthenticated], '404': [not_found], '422': [invalid_request], '503': [temporarily_unavailable]}
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ProjectStatus'}
      responses:
        '200':
          description: One page of projects, each with its brand.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectList'}
              examples:
                default: {externalValue: fixtures/responses/projects-list.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project with its (possibly empty) brand
      description: |
        Creates the `projects` row and exactly one `project_brands` row in one transaction. Never writes to the
        legacy `brand_profiles` table. With `Idempotency-Key`, a repeated identical request returns the project
        created by the first one (`200` instead of `201`); a different payload under the same key is
        `409 idempotency_conflict`.
      x-status: proposed
      x-stage: B4
      x-availability: internal-beta
      x-min-role: editor
      x-error-codes: {'401': [unauthenticated], '403': [csrf_failed, forbidden], '404': [not_found], '409': [idempotency_conflict], '422': [invalid_request], '429': [rate_limited], '503': [temporarily_unavailable]}
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
            examples:
              default: {externalValue: fixtures/requests/project-create.json}
      responses:
        '200':
          description: Idempotent replay; the project created earlier under this Idempotency-Key.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '201':
          description: Project created.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
              examples:
                default: {externalValue: fixtures/responses/project.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project with its brand
      x-status: proposed
      x-stage: B4
      x-availability: internal-beta
      x-min-role: viewer
      x-error-codes: {'401': [unauthenticated], '404': [not_found], '503': [temporarily_unavailable]}
      responses:
        '200':
          description: The project.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
              examples:
                default: {externalValue: fixtures/responses/project.200.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404':
          description: Unknown project or a project of another organization (indistinguishable).
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                foreignProject: {externalValue: fixtures/errors/not-found-foreign-project.404.json}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Edit project metadata (name, status, colour)
      description: |
        Optimistic concurrency: `expected_version` must equal the stored `version`, otherwise
        `409 stale_project` and nothing is written. Brand fields are edited through `updateProjectBrand`.
        Moving a project to another organization is not supported.
      x-status: proposed
      x-stage: B4
      x-availability: internal-beta
      x-min-role: editor
      x-error-codes: {'401': [unauthenticated], '403': [csrf_failed, forbidden], '404': [not_found], '409': [stale_project], '422': [invalid_request], '503': [temporarily_unavailable]}
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectPatch'}
      responses:
        '200':
          description: Updated project with the new `version`.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Version conflict.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                staleProject: {externalValue: fixtures/errors/stale-project.409.json}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/projects/{project_id}/brand:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProjectBrand
      summary: Get the brand context of a project
      description: |
        The brand is what the AI core receives as brand context for requests in this project
        (`brand_entries(to_context(project_brand))`, existing pure functions reused through an adapter).
        Explicit request `context` values always take precedence over the brand (existing core rule).
      x-status: proposed
