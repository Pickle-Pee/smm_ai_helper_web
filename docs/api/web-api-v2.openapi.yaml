              schema: {$ref: '#/components/schemas/MessageResult'}
              examples:
                workflowStarted: {externalValue: fixtures/responses/message-workflow-started.202.json}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: CSRF failure, insufficient role or disabled feature.
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControlPrivate'}
