name: Frontend checks

on:
  push:
    branches: [main, feat/saas-web-foundation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Generated Web API v2 types match docs/api/web-api-v2.openapi.yaml
        run: npm run check:api
      - run: npm test
      - name: Shell scripts (syntax + shellcheck)
        run: |
          for f in deploy/bin/*.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/bin/*.sh scripts/*.sh
      - run: npm run build

  contract:
    name: Web API v2 contract (C0)
    runs-on: ubuntu-latest
    env:
      # Backend baseline the `existing` DTOs were projected from (info.x-backend-baseline). Read-only.
      BACKEND_BASELINE: 76b6c1b5a69877cd6029397e4e13db36070ad039
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/api/tools/requirements.txt
      - run: pip install -r docs/api/tools/requirements.txt
      - name: OpenAPI 3.1, $refs, fixtures, golden cases, cache headers
        run: python docs/api/tools/check_contract.py
      - name: Backend source (read-only, pinned baseline)
        uses: actions/checkout@v4
        with:
          repository: Pickle-Pee/smm_ai_helper
          ref: ${{ env.BACKEND_BASELINE }}
          path: .backend-baseline
          persist-credentials: false
      - name: Existing DTOs and fixture payloads against the real backend models
        run: python docs/api/tools/check_contract.py --backend-repo .backend-baseline --backend-ref "$BACKEND_BASELINE"

  docker:
    name: docker image + smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: brenvio-web:ci
          build-args: |
            SITE_URL=https://app.24rubridge.ru
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: test "$(docker image inspect -f '{{.Config.User}}' brenvio-web:ci)" = "brenvio"
      - name: Start container (same hardening as production)
        run: |
          docker run -d --name web -p 127.0.0.1:3100:3000 --init --read-only \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=1001,gid=1001 \
            --cap-drop ALL --security-opt no-new-privileges --memory 384m brenvio-web:ci
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' web); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ]
      - name: Smoke test
        run: bash scripts/smoke.sh http://127.0.0.1:3100 "${{ github.sha }}"
      - name: Graceful shutdown on SIGTERM
        run: |
          start=$(date +%s); docker stop -t 20 web; took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' web)
          echo "stopped in ${took}s, exit code $code"
          [ "$took" -lt 15 ] && { [ "$code" = 0 ] || [ "$code" = 143 ]; }
      - name: Container logs
        if: always()
        run: docker logs web 2>&1 | tail -50 || true
      - name: Image size
        run: docker image ls brenvio-web:ci
